<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <form>
        <fieldset>

            <div class="Contact-Abstand">
                <label for="exampleInputEmail1" class="form-label mt-4">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Enter email" required>
            </div>

            <div class="Contact-Abstand">
                <label for="exampleTextarea" class="form-label mt-4">Message</label>
                <textarea class="form-control" id="exampleTextarea" rows="3" required></textarea>
            </div>

            <div class="Contact-Abstand">
                <label for="formFile" class="form-label mt-4">Default file input</label>
                <input class="form-control" type="file" id="formFile">
            </div>

            <div class="form-check mt-3 Contact-Abstand">
                <input class="form-check-input " type="checkbox" value="" id="flexCheckDefault" required>
                <label class="form-check-label" for="flexCheckDefault">
                    I agree to the terms and conditions.
                </label>
            </div>
            <div class="Submit-Back">
                <button type="submit" class="btn btn-primary mt-3 ">Submit</button>
                <a href="index.html" class="btn btn-primary mt-3 ">Back</a>
            </div>
        </fieldset>
    </form>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
